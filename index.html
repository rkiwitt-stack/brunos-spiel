<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Brunos Spiel</title>

<body>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
/* Layout: Vollbild-3D-Welt, HUD-Chips oben, Joystick unten links, Aktionsknöpfe unten rechts */
:root{
  --sky:#a8d8f0; --ink:#22301d; --chip:rgba(255,255,255,.92);
  --go:#2f8f3a; --horn:#e0662a; --tool:#2d6fb7; --gold:#f2b705; --exit:#6b5a4a; --off:#8a8f86;
  --font:'Fredoka', ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--font);color:var(--ink);-webkit-tap-highlight-color:transparent;}
#game{position:fixed;inset:0;}
#game canvas{display:block;width:100%;height:100%;}
.hud{position:fixed;z-index:5;pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 12px);
  left:calc(env(safe-area-inset-left,0px) + 12px);
  right:calc(env(safe-area-inset-right,0px) + 12px);
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0;}
.col.r{align-items:flex-end;}
.chip{background:var(--chip);border-radius:14px;padding:7px 13px;font-weight:700;font-size:17px;
  box-shadow:0 3px 0 rgba(0,0,0,.18);white-space:nowrap;}
.chip small{font-weight:500;font-size:13px;opacity:.7;margin-left:6px;}
.chip.goal{white-space:normal;font-weight:500;font-size:15px;max-width:min(380px, 52vw);line-height:1.25;}
.chip.goal b{font-weight:700;}
.chip.cargo{font-size:15px;font-weight:500;}
#hint{position:fixed;z-index:6;left:50%;transform:translateX(-50%);pointer-events:none;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);max-width:min(420px, calc(100% - 460px));
  background:var(--ink);color:#fff;border-radius:22px;padding:9px 18px;font-size:17px;font-weight:500;
  text-align:center;transition:opacity .4s;opacity:0;}
#zone{position:fixed;z-index:3;left:0;top:0;bottom:0;width:50%;}
#stick{position:fixed;z-index:4;pointer-events:none;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;
  background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.75);}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.2);}
.actions{position:fixed;z-index:4;display:flex;flex-direction:column;gap:12px;align-items:flex-end;
  right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);}
.small{display:flex;gap:10px;flex-wrap:wrap-reverse;justify-content:flex-end;max-width:260px;}
.btn{width:116px;height:116px;border-radius:50%;border:4px solid #fff;background:var(--go);color:#fff;
  font-family:var(--font);font-weight:700;font-size:15px;line-height:1.1;box-shadow:0 5px 0 rgba(0,0,0,.25);
  touch-action:none;cursor:pointer;padding:6px;}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
.btn:focus-visible{outline:4px solid var(--gold);outline-offset:3px;}
.btn.s{width:78px;height:78px;font-size:12px;border-width:3px;padding:3px;}
.btn.horn{background:var(--horn);} .btn.tool{background:var(--tool);} .btn.exit{background:var(--exit);}
.btn.off{background:var(--off);}
.btn .big{display:block;font-size:30px;margin-bottom:2px;}
.btn.s .big{font-size:22px;}
#keys{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);
  font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;}
@media (hover:none){#keys{display:none;}}
@media (max-width:700px){ .chip.goal{font-size:13px;} #hint{font-size:15px;bottom:auto;max-width:calc(100% - 32px);top:calc(env(safe-area-inset-top,0px) + 120px);} }
.zoom{display:flex;gap:8px;pointer-events:auto;}
.zoom button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--tool);color:#fff;font:700 26px/1 var(--font);box-shadow:0 3px 0 rgba(0,0,0,.2);touch-action:none;cursor:pointer;}
.zoom button:active{transform:translateY(2px);}
.chip.tasks{white-space:normal;font-weight:500;font-size:14px;max-width:min(390px,54vw);line-height:1.3;display:flex;flex-direction:column;gap:5px;}
.task{display:flex;gap:6px;align-items:center;}
.task .tx{flex:1;min-width:0;}
.task .bar{flex:0 0 44px;height:7px;border-radius:4px;background:#dfe6d6;overflow:hidden;}
.task .bar i{display:block;height:100%;background:var(--go);}
.tasks .hintline{font-size:13px;border-top:1px solid #e3e8dc;padding-top:5px;}
.tasks .hintline b{font-weight:700;}
[hidden]{display:none !important;}
.creator{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:flex-start;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  background:linear-gradient(90deg, rgba(34,48,29,.5), rgba(34,48,29,0) 70%);}
.creator .card{background:var(--chip);border-radius:20px;padding:16px 18px;max-width:330px;width:100%;max-height:calc(100% - 32px);overflow:auto;
  box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;gap:11px;}
.creator h2{margin:0;font-size:22px;}
.creator label,.creator .row{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:15px;}
.creator input{font:500 18px var(--font);padding:8px 12px;border-radius:12px;border:2px solid #cfd8c6;-webkit-user-select:text;user-select:text;}
.creator .opts{display:flex;gap:8px;flex-wrap:wrap;}
.creator .opts button{min-width:38px;height:38px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 2px #cfd8c6;cursor:pointer;font:600 14px var(--font);background:#fff;color:var(--ink);padding:0 10px;}
.creator .opts button.on{box-shadow:0 0 0 3px var(--ink);}
.creator .newgame{height:40px;border-radius:14px;border:2px solid #d9b0a8;background:#fff6f4;color:#a23a2b;font:700 15px var(--font);cursor:pointer;}
.creator .go{height:52px;border-radius:16px;border:0;background:var(--go);color:#fff;font:700 19px var(--font);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;z-index:9;background:var(--sky);}
</style>

<div id="loading">Brunos Spiel lädt …</div>
<div id="game"></div>
<div class="hud">
  <div class="col">
    <div class="chip" id="title">Brunos Spiel</div>
    <div class="chip tasks" id="goal"></div>
  </div>
  <div class="col r">
    <div class="chip" id="money">💰 0 €</div>
    <div class="chip cargo" id="clock"></div>
    <div class="chip cargo" id="cargo" hidden></div>
    <div class="zoom"><button id="figBtn" aria-label="Figur ändern">👤</button><button id="zoomOut" aria-label="Rauszoomen">−</button><button id="zoomIn" aria-label="Reinzoomen">+</button></div>
  </div>
</div>
<div id="hint"></div>
<div id="zone"></div>
<div id="stick"><div id="knob"></div></div>
<div class="actions">
  <div class="small">
    <button class="btn s exit" id="exitBtn" hidden><span class="big">🚪</span>Aussteigen</button>
    <button class="btn s horn" id="hornBtn" hidden><span class="big">📯</span>Hupe</button>
    <button class="btn s tool" id="detachBtn" hidden><span class="big">🔗</span>Abkoppeln</button>
    <button class="btn s tool" id="seedBtn" hidden><span class="big">🌱</span><span id="seedLabel">Weizen</span></button>
    <button class="btn s tool" id="toolBtn" hidden><span class="big" id="toolIcon">🪓</span><span id="toolLabel">Axt</span></button>
    <button class="btn s tool" id="act2Btn" hidden><span class="big" id="act2Icon">⬇️</span><span id="act2Label"></span></button>
  </div>
  <button class="btn" id="actBtn" hidden><span class="big" id="actIcon">🚜</span><span id="actLabel"></span></button>
</div>
<div id="keys">WASD / Pfeile fahren · Mausrad oder +/− zoomen · Leertaste Aktion · F zweite Aktion · T Werkzeug · E aussteigen · Q abkoppeln · R Saat · H hupen</div>

<div class="creator" id="creator" hidden>
  <div class="card">
    <h2>Erstelle deine Figur</h2>
    <label for="cName">Name<input id="cName" maxlength="14" value="Bruno" autocomplete="off"></label>
    <div class="row">Hut<div class="opts" id="oHat"></div></div>
    <div class="row">Hemd<div class="opts" id="oShirt"></div></div>
    <div class="row">Hose<div class="opts" id="oPants"></div></div>
    <div class="row">Haut<div class="opts" id="oSkin"></div></div>
    <div class="row">Haare<div class="opts" id="oHair"></div></div>
    <button class="go" id="cGo">Los geht's! 🚜</button>
    <button class="newgame" id="cNew">🔄 Neues Spiel anfangen</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="text/plain" id="gameCode">
(function(){
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const now = () => performance.now()/1000;
let growT = 0; // Wachstums-Uhr: steht im Winter still

// ---------- Renderer, Szene, Kamera ----------

addEventListener('resize', resize); resize();

  m.position.set(x,y,z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}

  m.position.set(x,y,z); m.castShadow = true; parent.add(m); return m;
}
function canvasTex(size, draw, rx, ry){

  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry || rx); return t;
}
function prismRoof(w, d, h, color, x, y, z, parent=scene){
  const s = new THREE.Shape(); s.moveTo(-d/2,0); s.lineTo(d/2,0); s.lineTo(0,h); s.lineTo(-d/2,0);
  const m = new THREE.Mesh(new THREE.ExtrudeGeometry(s, {depth:w, bevelEnabled:false}), mat(color));
  m.rotation.y = Math.PI/2; m.position.set(x - w/2, y, z); m.castShadow = true; parent.add(m); return m;
}
const dummy = new THREE.Object3D();
const drnd = Math.random;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1);
// Farbverlauf von unten (dunkel) nach oben (hell): wirkt wie weiches Schattenlicht
function shadeGeo(g, lo=0.6, hi=1.1){
  g.computeBoundingBox(); const b = g.boundingBox, pos = g.attributes.position, n = pos.count, col = new Float32Array(n*3);
  const h = Math.max(0.001, b.max.y - b.min.y);
  for (let i=0;i<n;i++){ const k = lo + (hi - lo)*Math.pow((pos.getY(i) - b.min.y)/h, 0.8); col[i*3] = col[i*3+1] = col[i*3+2] = k; }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); return g;
}
function mergeGeos(list){
  const gs = list.map(g => g.index ? g.toNonIndexed() : g); let n = 0; gs.forEach(g => n += g.attributes.position.count);
  const P = new Float32Array(n*3), Nn = new Float32Array(n*3), U = new Float32Array(n*2); let o = 0;
  gs.forEach(g => { const c = g.attributes.position.count; P.set(g.attributes.position.array, o*3); Nn.set(g.attributes.normal.array, o*3);
    if (g.attributes.uv) U.set(g.attributes.uv.array, o*2); o += c; });
  const m = new THREE.BufferGeometry(); m.setAttribute('position', new THREE.BufferAttribute(P,3)); m.setAttribute('normal', new THREE.BufferAttribute(Nn,3)); m.setAttribute('uv', new THREE.BufferAttribute(U,2)); return m;
}
// Pflanzen aus gekreuzten Bildflächen (sieht dicht aus, kostet wenig)
function cardGeo(w, h, nx, nz, d){
  const list = [];
  for (let i=0;i<nx;i++){ const g = new THREE.PlaneGeometry(w, h); g.translate(0, h/2, (i - (nx-1)/2)*d); list.push(g); }
  for (let i=0;i<nz;i++){ const g = new THREE.PlaneGeometry(w, h); g.rotateY(Math.PI/2); g.translate((i - (nz-1)/2)*d, h/2, 0); list.push(g); }
  list.slice().forEach(g => list.push(g.clone().rotateY(Math.PI))); // Rückseiten, damit beide Seiten hell beleuchtet sind

}
function plantTex(w, h, draw){ const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.anisotropy = ANISO; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; return t; }
const wheatTex = plantTex(256, 128, (g, W, H) => {
  for (let i=0;i<120;i++){ const x = drnd()*W, lean = (drnd()-0.5)*10, top = 10 + drnd()*30, l = 0.75 + drnd()*0.25;
    const gr = g.createLinearGradient(0, H, 0, top); gr.addColorStop(0, `rgb(${110*l|0},${105*l|0},${80*l|0})`); gr.addColorStop(1, `rgb(${235*l|0},${232*l|0},${215*l|0})`);

});
const cornTex = plantTex(128, 256, (g, W, H) => {
  for (let i=0;i<9;i++){ const x = 8 + i*(W-16)/8 + (drnd()-0.5)*6;
    g.strokeStyle = '#c9d6b8'; g.lineWidth = 4; g.beginPath(); g.moveTo(x, H); g.lineTo(x, 14); g.stroke();

    g.fillStyle = '#f4ecc8'; g.fillRect(x - 2, 4, 4, 14); }
});

const tmpC = new THREE.Color();

// Text-Schilder und Emoji-Symbole
const labels = [];
function makeLabel(text, x, y, z, size=2.2){
  const cv = document.createElement('canvas'), g = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);

    cv.width = w; cv.height = h;

    g.fillStyle = '#22301d'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, w/2, h/2 + 2);

}
const emojiTex = {};
function emojiSprite(e, size=1.4){
  if (!emojiTex[e]){
    const cv = document.createElement('canvas'); cv.width = cv.height = 96; const g = cv.getContext('2d');
    g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(48,48,44,0,Math.PI*2); g.fill();

}
const floaters = [];
function floatEmoji(e, x, y, z){ const s = emojiSprite(e, 1.2); s.position.set(x,y,z); floaters.push({s, life:1.4}); }

// ---------- Welt ----------
const WORLD = 120;
const grassTex = canvasTex(512, (g,s) => {
  g.fillStyle = '#70b84d'; g.fillRect(0,0,s,s);
  for (let i=0;i<260;i++){ g.fillStyle = drnd()<.5 ? 'rgba(80,150,50,.25)' : 'rgba(140,210,95,.22)'; g.beginPath(); g.arc(drnd()*s, drnd()*s, 6+drnd()*22, 0, Math.PI*2); g.fill(); }
  for (let i=0;i<5200;i++){ const x = drnd()*s, y = drnd()*s, l = 3 + drnd()*6, c = drnd();
    g.strokeStyle = c<.33 ? '#5aa53b' : c<.66 ? '#7fcc57' : '#8fd866'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (drnd()-0.5)*3, y - l); g.stroke(); }
}, 34);
grassTex.anisotropy = ANISO;
const groundGeo = new THREE.PlaneGeometry(WORLD*2+80, WORLD*2+80, 80, 80);
{ // große, weiche Farbflecken gegen das Kachelmuster
  const pos = groundGeo.attributes.position, col = new Float32Array(pos.count*3);
  for (let i=0;i<pos.count;i++){ const x = pos.getX(i), y = pos.getY(i);
    const n = Math.sin(x*0.045 + 1.3)*Math.cos(y*0.05 - 0.7)*0.5 + Math.sin(x*0.11 + y*0.07)*0.3 + Math.cos(x*0.023 - y*0.031)*0.4;
    const k = 0.93 + n*0.07; col[i*3] = k*(1 + n*0.03); col[i*3+1] = k; col[i*3+2] = k*(1 - n*0.05); }
  groundGeo.setAttribute('color', new THREE.BufferAttribute(col, 3)); }
const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({map:grassTex, vertexColors:true}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
function flat(w,d,material,x,z,y=0.02){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,d), material);

  while (k < n && tries++ < n*8){ const x = area[0] + drnd()*(area[1]-area[0]), z = area[2] + drnd()*(area[3]-area[2]);

// ---------- Kollision ----------
function push(p, cx, cz, m){
  const dx = p.x-cx, dz = p.z-cz, d2 = dx*dx+dz*dz;
  if (d2 < m*m){ const d = Math.sqrt(d2) || 0.001; p.x = cx + dx/d*m; p.z = cz + dz/d*m; return true; }
  return false;
}
function resolve(p, r){
  let hit = false;
  for (const o of circles) if (o.r && push(p, o.x, o.z, r + o.r)) hit = true;
  for (const b of boxes){
    const cx = clamp(p.x,b.x0,b.x1), cz = clamp(p.z,b.z0,b.z1), dx = p.x-cx, dz = p.z-cz, d2 = dx*dx+dz*dz;
    if (d2 < r*r){ if (d2 > 1e-6){ const d = Math.sqrt(d2); p.x = cx + dx/d*r; p.z = cz + dz/d*r; } else p.z = b.z1 + r; hit = true; }
  }
  const lim = WORLD - 2;
  if (Math.abs(p.x) > lim || Math.abs(p.z) > lim){ p.x = clamp(p.x,-lim,lim); p.z = clamp(p.z,-lim,lim); hit = true; }
  return hit;
}

});

function readDir(){
  let x = input.x, y = input.y;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1;
  if (keys.has('arrowdown') || keys.has('s')) y += 1;
  const m = Math.hypot(x,y); if (m > 1){ x /= m; y /= m; }
  return {x, z:y, m:Math.min(m,1)};
}

let ac = null, engOsc = null, engGain = null;
function audio(){
  if (ac) return ac;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    engOsc = ac.createOscillator(); engOsc.type = 'sawtooth'; engOsc.frequency.value = 40;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 300;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engOsc.connect(lp).connect(engGain).connect(ac.destination); engOsc.start();
  } catch(_) { ac = null; }
  return ac;
}
function beep(freqs, dur, vol=0.15, type='square'){
  const a = ac; if (!a) return;
  const t = a.currentTime, g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.03);
  g.gain.setValueAtTime(vol, t+Math.max(0.05, dur-0.12)); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  g.connect(a.destination);
  freqs.forEach((f,i) => { const o = a.createOscillator(); o.type = type; o.frequency.value = f; o.connect(g); o.start(t + (type==='sine' ? i*0.09 : 0)); o.stop(t+dur+0.02); });
}

function enterVehicle(v){

function exitVehicle(){
  const v = driving; if (!v) return;
  if (Math.abs(v.speed) > 3) { setHint('Erst langsamer werden!', 1500); return; }
  driving = null; v.speed = 0;
  const h = v.g.rotation.y, lx = v.r + 0.7, lz = -0.3;
  scene.add(player); player.scale.setScalar(1);
  player.position.set(v.g.position.x + Math.cos(h)*lx + Math.sin(h)*lz, 0, v.g.position.z - Math.sin(h)*lx + Math.cos(h)*lz);
  resolve(player.position, 0.45); player.rotation.y = h;
  legL.rotation.set(0,0,0); legR.rotation.set(0,0,0); armL.rotation.x = armR.rotation.x = 0;

}

function placeImpl(im, snap){

  const hx = v.g.position.x + Math.sin(h)*v.hitch, hz = v.g.position.z + Math.cos(h)*v.hitch;
  let ih = snap ? h : Math.atan2(hx - im.g.position.x, hz - im.g.position.z);
  ih = h + clamp(angDiff(ih, h), -1.25, 1.25);
  im.g.rotation.y = ih; im.g.position.set(hx - Math.sin(ih)*im.L, 0, hz - Math.cos(ih)*im.L);

function moveCargo(from, to){
  const n = Math.min(from.cargo.amount, to.cap - to.cargo.amount); if (n <= 0) return 0;
  to.cargo.type = from.cargo.type; to.cargo.amount += n; from.cargo.amount -= n; if (!from.cargo.amount) from.cargo.type = null;

    const pp = player.position;
    for (const v of vehicles) if (dist2(pp, v.g.position) < v.r + 2.2){

      else if (money >= v.price) add('🛒', `Kaufen ${v.price} €`, () => { money -= v.price; showMoney(); v.owned = true; v.label.sp.visible = false; ding(); track('auto'); setHint(`Juhu! Der ${v.name} gehört jetzt dir! 🚗`, 3500); });
      else add('🔒', `${v.price} €`, () => setHint(`Dir fehlen noch ${v.price - money} €. Verdien Geld mit Ernte, Holz und Tieren!`, 3000), true);
    }
    if (near(PLACES.trough, pp) && !cowsFed) add('🌾', 'Kühe füttern', () => {

function driveVehicle(v, dt, dir){
  let target = 0, turn = 0; const h = v.g.rotation.y;
  if (dir.m > 0.15){
    const tA = Math.atan2(dir.x, dir.z), d = angDiff(tA, h);
    if (!v.rev && Math.abs(d) > 2.2 && Math.abs(v.speed) < 1.5) v.rev = true;
    else if (v.rev && Math.abs(d) < 1.3) v.rev = false;
    turn = angDiff(v.rev ? tA + Math.PI : tA, h);
    target = (v.rev ? -0.45 : 1) * dir.m * v.max;
  }
  if (!v.speed && !target) return;
  const acc = (Math.sign(target) !== Math.sign(v.speed) || Math.abs(target) < Math.abs(v.speed)) ? 14 : 7;
  v.speed += clamp(target - v.speed, -acc*dt, acc*dt);
  if (Math.abs(v.speed) < 0.02 && !target) v.speed = 0;
  const grip = clamp(Math.abs(v.speed)/2.5, 0, 1);
  v.g.rotation.y += clamp(turn*3, -1.7, 1.7) * dt * grip;
  const nh = v.g.rotation.y, p = v.g.position;
  p.x += Math.sin(nh) * v.speed * dt; p.z += Math.cos(nh) * v.speed * dt;
  let hit = resolve(p, v.r);
  for (const o of vehicles) if (o !== v && push(p, o.g.position.x, o.g.position.z, v.r + o.r)) hit = true;
  if (hit) v.speed *= 0.6;
  const sv = clamp(turn, -0.55, 0.55) * (v.rev ? -1 : 1) * v.steerSign;
  v.steer.forEach(s => s.rotation.y += (sv - s.rotation.y) * Math.min(1, dt*8));
  v.wheels.forEach(([w, r]) => w.rotation.x += v.speed*dt/r);
  if (v.reel) v.reel.rotation.x += dt * (Math.abs(v.speed) > 0.3 ? 4 : 0.5);
  if (v.legs){ v.phase = (v.phase || 0) + v.speed*dt*2.2; v.legs.forEach((l,i) => l.rotation.x = Math.sin(v.phase + (i===0||i===3 ? 0 : Math.PI)) * Math.min(0.7, Math.abs(v.speed)*0.15)); }
  if (v.impl) placeImpl(v.impl, false);
}
let fullWarnAt = 0;
function work(v){
  if (v.speed < 0.5) return;
  const im = v.impl;
  if (im && (im.kind === 'pflug' || im.kind === 'saat' || im.kind === 'presse')){
    const ih = im.g.rotation.y;
    for (const lx of [-1.5, -0.5, 0.5, 1.5]){
      const cell = cellAt(im.g.position.x + Math.cos(ih)*lx, im.g.position.z - Math.sin(ih)*lx);
      if (!cell) continue;
      if (im.kind === 'pflug' && cell.state === 0){ cell.state = 1; cell.crop = null; cell.straw = false; drawCell(cell); }
      else if (im.kind === 'saat' && cell.state === 1 && SEASONS[season].seeds.length){ cell.state = 2; cell.crop = SEEDS[seedIdx]; cell.t0 = growT; cell.q = 0; drawCell(cell); cellVisual(cell); }
      else if (im.kind === 'presse' && cell.state === 0 && cell.straw){
        cell.straw = false; drawCell(cell); im.straw++;
        if (im.straw >= 5){ im.straw = 0; const b = makeItem('ballen', im.g.position.x - Math.sin(ih)*2.2, im.g.position.z - Math.cos(ih)*2.2); b.g.rotation.y = ih; beep([300,200], 0.3, 0.1); }
      }
    }
  }
  if (v === combineV){
    const h = v.g.rotation.y, p = v.g.position, t = v.hold.cargo;
    for (const lx of [-2.3, -1.15, 0, 1.15, 2.3]){
      const cell = cellAt(p.x + Math.cos(h)*lx + Math.sin(h)*3.6, p.z - Math.sin(h)*lx + Math.cos(h)*3.6);
      if (!cell || cell.state !== 3) continue;
      const a = CROPS[cell.crop].kg;
      if ((t.amount && t.type !== cell.crop) || t.amount + a > v.hold.cap){
        if (now() > fullWarnAt){ fullWarnAt = now() + 4; setHint(t.amount + a > v.hold.cap ? 'Tank voll! Fahr zum Anhänger oder verkaufen.' : `Erst die ${GOODS[t.type].name} abladen!`, 3000); }
        continue;

      cell.straw = cell.crop === 'weizen'; cell.state = 0; cell.crop = null; drawCell(cell); cellVisual(cell);
    }
  }
}

let walkPhase = 0;
function updateWalk(dt, dir){
  const p = player.position;
  if (dir.m > 0.1){
    p.x += dir.x * 5.5 * dt; p.z += dir.z * 5.5 * dt;
    player.rotation.y += angDiff(Math.atan2(dir.x, dir.z), player.rotation.y) * Math.min(1, dt*12);
    walkPhase += dt * 11 * dir.m;
  } else walkPhase *= 0.85;
  const sw = Math.sin(walkPhase) * 0.7;
  legL.rotation.x = sw; legR.rotation.x = -sw; armL.rotation.x = -sw*0.8; armR.rotation.x = sw*0.8;
  p.y = Math.abs(Math.sin(walkPhase)) * 0.08;
  resolve(p, 0.45);
  for (const v of vehicles) push(p, v.g.position.x, v.g.position.z, v.r + 0.3);
  for (const c of cows) push(p, c.g.position.x, c.g.position.z, 1.1);
}

    if (im.cargo) o.cargo = {type:im.cargo.type, amount:im.cargo.amount}; if (im.straw) o.straw = im.straw; return o; });
  const its = items.map(it => [it.kind, r1(it.g.position.x), r1(it.g.position.z), r1(it.g.rotation.y)]);
  if (forkV.carry){ const q = fwd(forkV, 2.2); its.push([forkV.carry.kind, r1(q.x), r1(q.z), r1(forkV.g.rotation.y)]); }
  const tr = [];
  trees.forEach((t, i) => { if (i < NGEN){ if (t.felled || t.sick || t.hp) tr.push([i, t.felled ? 1 : 0, t.felled ? Math.max(0, Math.round(t.growAt - T)) : 0, t.sick ? 1 : 0, t.hp || 0]); } });
  const pt = trees.slice(NGEN).map(t => [r1(t.x), r1(t.z), Math.round(T - (t.plantedAt || T)), t.felled ? 1 : 0, t.felled ? Math.max(0, Math.round(t.growAt - T)) : 0]);
  const pos = driving ? driving.g.position : player.position;
  return {v:SAVE_V, savedAt:Date.now(), money, xp, level, toolSel, seedIdx, P:Object.assign({}, P), done:[...done],
    clock:Math.round(clock), day, season, growT:Math.round(growT), stats:Object.assign({}, stats), milch:bag.milch, planted,
    player:[r1(pos.x), r1(pos.z), r1(player.rotation.y)], look:Object.assign({}, look),
    cells:cells.map(c => [c.state, c.crop ? SEEDS.indexOf(c.crop) : -1, Math.round(c.t0), c.straw ? 1 : 0]),
    vehicles:vs, impls:is, items:its, trees:tr, planted_trees:pt, pigs:pigs.length,
    mill:{input:Object.assign({}, mill.input), out:Object.assign({}, mill.out)}, saw:saw.logs, spalter:spalter.logs};
}
function applySave(S){
  if (!S || S.v !== SAVE_V) return false;
  const T = now();
  if (driving) exitVehicle();
  money = S.money || 0; xp = S.xp || 0; level = S.level || 1; showMoney();
  for (let l = 2; l <= level; l++) if (LEVEL_REWARDS[l]) LEVEL_REWARDS[l][1]();
  toolSel = chainsaw ? (S.toolSel || 'saege') : 'axt'; seedIdx = S.seedIdx || 0;
  for (const k in P) delete P[k]; Object.assign(P, S.P || {});
  done.clear(); (S.done || []).forEach(d => done.add(d));
  clock = S.clock || 0; day = S.day || 1; growT = S.growT || 0; Object.assign(stats, S.stats || {}); bag.milch = S.milch || 0;
  if (S.season !== season){ season = S.season || 0; applySeason(); }
  if (S.look){ Object.assign(look, S.look); applyLook(); nameLabel.set(look.name); try { localStorage.setItem('brunos-spiel-figur', JSON.stringify(look)); } catch(_) {}
    if (creatorOpen){ creatorOpen = false; $('creator').hidden = true; setZoom(1); } }
  // Felder
  (S.cells || []).forEach((a, i) => { const c = cells[i]; if (!c) return; c.state = a[0]; c.crop = a[1] >= 0 ? SEEDS[a[1]] : null; c.t0 = a[2]; c.straw = !!a[3]; c.q = -1; drawCell(c); cellVisual(c); });
  flushCrops();
  // Fahrzeuge und Geräte
  vehicles.forEach(v => { if (v.impl){ v.impl.att = null; v.impl = null; } });
  (S.impls || []).forEach((o, i) => { const im = impls[i]; if (!im) return; im.g.position.set(o.x, 0, o.z); im.g.rotation.y = o.h;
    if (im.cargo && o.cargo){ im.cargo.type = o.cargo.type; im.cargo.amount = o.cargo.amount; } if (o.straw !== undefined) im.straw = o.straw; });
  (S.vehicles || []).forEach((o, i) => { const v = vehicles[i]; if (!v) return; v.g.position.set(o.x, 0, o.z); v.g.rotation.y = o.h; v.speed = 0;
    if (v.price){ v.owned = o.own; if (v.label) v.label.sp.visible = !o.own; }
    if (v.hold && o.cargo){ v.hold.cargo.type = o.cargo.type; v.hold.cargo.amount = o.cargo.amount; }
    if (o.impl >= 0 && impls[o.impl]){ v.impl = impls[o.impl]; impls[o.impl].att = v; placeImpl(impls[o.impl], true); } });
  if (forkV.carry){ forkV.forks.remove(forkV.carry.g); forkV.carry = null; }
  // Gegenstände
  items.slice().forEach(it => scene.remove(it.g)); items.length = 0;
  palletSlots.concat(splitSlots).forEach(sl => sl.item = null);
  (S.items || []).forEach(([k, x, z, h]) => { const it = makeItem(k, x, z); it.g.rotation.y = h || 0;
    const sl = palletSlots.concat(splitSlots).find(q => Math.hypot(q.x - x, q.z - z) < 0.6); if (sl) sl.item = it; });
  // Bäume
  trees.slice(NGEN).forEach(t => { scene.remove(t.mesh); const ci = circles.indexOf(t.c); if (ci >= 0) circles.splice(ci, 1); }); trees.length = NGEN;
  trees.forEach(t => { if (t.felled){ t.felled = false; t.c.r = 0.7*t.s; setTree(t, 1); } if (t.sick){ t.sick = false; paintTree(t); } t.hp = undefined; });
  sickCount = 0;
  (S.trees || []).forEach(([i, f, g, sk, hp]) => { const t = trees[i]; if (!t) return;
    if (f){ t.felled = true; t.growAt = T + g; t.c.r = 0; setTree(t, 0); }
    if (sk){ t.sick = true; sickCount++; paintTree(t); } if (hp) t.hp = hp; });
  planted = 0;
  (S.planted_trees || []).forEach(([x, z, age, f, g]) => { const t = plantTree(x, z); t.plantedAt = T - age;
    if (f){ t.felled = true; t.growing = false; t.growAt = T + g; t.c.r = 0; setTree(t, 0); } });
  planted = S.planted || planted;
  // Tiere
  const np = S.pigs === undefined ? pigs.length : S.pigs;
  while (pigs.length > np){ const pg = pigs.pop(); scene.remove(pg.g); animals.splice(animals.indexOf(pg), 1); }
  while (pigs.length < np) pigs.push(makeAnimal('pig', -14 + Math.random()*6, -60 + Math.random()*7, PIG_B));
  // Verarbeitung
  if (S.mill){ mill.input = Object.assign({}, S.mill.input); Object.assign(mill.out, S.mill.out); }
  saw.logs = S.saw || 0; spalter.logs = S.spalter || 0;
  if (S.player){ player.position.set(S.player[0], 0, S.player[1]); player.rotation.y = S.player[2]; resolve(player.position, 0.45); }
  camInit = false; lastSig = sigOf(S);
  return true;
}
const sigOf = S => JSON.stringify([S.money, S.xp, S.P, S.done, S.cells.map(c => c[0] + ',' + c[1]).join(''), S.items.length, S.trees.length, S.planted_trees.length, S.pigs, S.vehicles.map(v => v.own), S.mill, S.saw, S.spalter, S.milch, S.look]);
let lastSig = '', cloudDoc = null, cloudBusy = false, cloudAt = 0, newGameArmed = false;
function saveLocal(S){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(_) {} }
async function saveCloud(S){
  if (!cloudDoc || cloudBusy) return; cloudBusy = true;
  try { await cloudDoc.set({state: JSON.stringify(S), savedAt: S.savedAt}); cloudAt = Date.now(); lastSig = sigOf(S); }
  catch(e){ if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) cloudDoc = null; }
  cloudBusy = false;
}
function saveNow(force){
  if (newGameArmed === 'reset') return;
  const S = makeSave(); saveLocal(S);
  const sig = sigOf(S); if (force || (sig !== lastSig && Date.now() - cloudAt > 60000)) saveCloud(S);
}
setInterval(() => saveNow(false), 15000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(true); });
addEventListener('pagehide', () => saveNow(true));
let localSave = null; try { localSave = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch(_) {}
const hadSave = !!(localSave && applySave(localSave));
(async () => { // Spielstand auch im Konto sichern (geht auf allen Geräten)
  try {
    const cl = window.claude; if (!cl || !cl.use) return;
    const [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.collection('data/users/' + id).doc('spielstand');
    const snap = await ref.get(); cloudDoc = ref;
    if (snap.exists){ const d = snap.data() || {}; let S = null; try { S = JSON.parse(d.state); } catch(_) {}
      const localAt = localSave ? localSave.savedAt || 0 : 0;
      if (S && (S.savedAt || 0) > localAt + 2000 && applySave(S)){ saveLocal(S); setHint(`Spielstand geladen. Willkommen zurück, ${look.name}! 💾`, 3500); } }
    else if (hadSave) saveNow(true);
  } catch(_) {}
})();
$('cNew').addEventListener('click', () => {
  const b = $('cNew');
  if (!newGameArmed){ newGameArmed = true; b.textContent = '⚠️ Wirklich? Nochmal tippen!'; setTimeout(() => { if (newGameArmed === true){ newGameArmed = false; b.textContent = '🔄 Neues Spiel anfangen'; } }, 6000); return; }
  newGameArmed = 'reset';
  try { localStorage.removeItem(SAVE_KEY); } catch(_) {}
  const go = () => location.reload();
  if (cloudDoc) cloudDoc.delete().then(go, go); else go();
});
applySeason();
$('loading').remove();
if (!creatorOpen) setHint(hadSave ? `Spielstand geladen. Willkommen zurück, ${look.name}! 💾` : `Willkommen auf dem Hof, ${look.name}! 🚜`, 3000);
requestAnimationFrame(frame);
window.__game = {player, vehicles, impls, items, cells, trees, mill, saw, trailer, animalTrailer, get pigs(){ return pigs; }, cows, goats, sheep,
  get driving(){ return driving; }, get acts(){ return acts; }, doAction, exitVehicle, enterVehicle, attach,
  get money(){ return money; }, P, done, get xp(){ return xp; }, get level(){ return level; }, get season(){ return season; }, set clockT(v){ clock = v; }, setDay(d){ day = d - 1; clock = DAY_LEN - 0.01; }, get fire(){ return fire; }, startFire, forage, closeCreator, makeSave, applySave, saveNow, set money(v){ money = v; showMoney(); }, setTime(f){ cells.forEach(c => { if (c.state === 2) c.t0 -= f; }); }, renderer};
})();
</script>

<div id="gate" hidden>

    <button type="submit">Spielen</button>
    <div class="err" id="gateErr"></div>
  </form>
</div>
<script>
(function(){
  // Einfache Passwortabfrage (kein echter Schutz, nur damit nicht jeder mit dem Link spielt)
  var HASH = '3d40bc828710762cf88c4084b47cfb2afdb0391752b48ab865c8ec3a8fbf9078';
  var KEY = 'brunos-spiel-zugang';
  function start(){
    var g = document.getElementById('gate'); if (g) g.remove();
    var s = document.createElement('script');
    s.text = document.getElementById('gameCode').textContent;
    document.body.appendChild(s);
  }
  function sha(t){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){
      return Array.from(new Uint8Array(b)).map(function(x){ return x.toString(16).padStart(2,'0'); }).join('');
    });
  }
  function boot(){
    var ok = false; try { ok = localStorage.getItem(KEY) === HASH; } catch(_) {}
    if (ok) return start();
    var gate = document.getElementById('gate'); gate.hidden = false;
    var ld = document.getElementById('loading'); if (ld) ld.hidden = true;
    document.getElementById('gateForm').addEventListener('submit', function(e){
      e.preventDefault();
      var pw = document.getElementById('gatePw').value.trim().toLowerCase();
      sha(pw).then(function(h){
        if (h !== HASH){ document.getElementById('gateErr').textContent = 'Das Passwort stimmt leider nicht.'; return; }
        try { localStorage.setItem(KEY, HASH); } catch(_) {}
        if (ld) ld.hidden = false;
        document.activeElement && document.activeElement.blur();
        setTimeout(start, 30);
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
